
services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: launchpad-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-launchpad}
      POSTGRES_USER: ${POSTGRES_USER:-launchpad_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s

    networks:
      - launchpad-network

  # NestJS Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: launchpad-nestjs-api
    restart: unless-stopped

    environment:
      NODE_ENV: production
      PORT: 4000
      HOSTNAME: 0.0.0.0
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-launchpad}
      DB_USER: ${POSTGRES_USER:-launchpad_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}

    ports:
      - "4000:4000"

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

    networks:
      - launchpad-network

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api}

    container_name: launchpad-nextjs-frontend
    restart: unless-stopped

    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0

    ports:
      - "3000:3000"

    depends_on:
      backend:
        condition: service_healthy

    networks:
      - launchpad-network

volumes:
  postgres_data:

networks:
  launchpad-network:
    driver: bridge
